[pytest]
# 测试目录
testpaths = tests
# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 日志级别（避免测试输出被日志淹没）
log_level = WARNING
# 覆盖率设置
addopts = -v
# 忽略第三方库的弃用警告，保持输出清爽
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*
